# 作者：晨星
# helios-ai-stack pytest 配置（ARCH C7 / F-13）。
#
# 关键点：
#   1. --basetemp 固定到仓库内 data/.pytest-tmp，避免系统临时根被守卫拦截导致「假失败」；
#   2. -p no:cacheprovider 关闭 .pytest_cache，保持干净克隆可复现；
#   3. 判据一律以退出码 + 用例计数为准，不解析 stdout 文本。
[pytest]
addopts = -q --basetemp=data/.pytest-tmp -p no:cacheprovider
testpaths = src tests
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    requires_model: 需要本机模型/GGUF 就绪，未就绪则 skip
    slow: 耗时用例，默认不进快速门禁
    compat: 兼容层（LlamaIndex）用例，缺依赖则 skip
filterwarnings =
    ignore::DeprecationWarning
