# 作者：晨星
# helios-ai-stack lint 规则集（ARCH C10：ruff check . 必须 0 error）。
#
# 行数上限（单文件 <= 300 行）不由 ruff 负责，交由 scripts/scan_emoji.py 一并检查（ARCH C2）。
line-length = 140
target-version = "py313"
extend-exclude = [
    ".git",
    "data",
    "models",
    "benchmarks",
    "build",
    "dist",
    ".venv",
]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]
# TID252：包内 `from ..core.xxx` 相对导入是刻意的层次依赖（上层不反向依赖 core），
# 架构约束由代码评审保证，不交由 lint 全量禁止。
ignore = ["TID252"]

[lint.per-file-ignores]
# 示例脚本需要 sys.path 装配才能脱离安装运行，属于入口性质。
"src/helios/*/examples/*.py" = ["E402"]
"scripts/*.py" = ["T201"]

[lint.isort]
known-first-party = ["helios"]
lines-after-imports = 2
lines-between-types = 1
